<div class="container body-container">
  <div class="main-container">
    <h2>Pickup Request</h2>
    <hr />

    <div class="row" *ngIf="mailSent || mailError">
      <div class="col-md-12">
        <div
          class="alert"
          [class.alert-success]="mailSent"
          [class.alert-danger]="!mailSent"
          role="alert"
        >
          <span *ngIf="mailSent"
            >Your pickup request was sent successfully. Our team will contact you shortly.</span
          >
          <span *ngIf="!mailSent">{{
            mailError || 'Failed to send your request. Please contact us through email or phone.'
          }}</span>
        </div>
      </div>
    </div>

    <div class="row" *ngIf="!mailSent">
      <div class="col-md-12">
        <form #pickupForm="ngForm" (ngSubmit)="sendPickup(pickupForm)">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="name">Your Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Enter your name"
                  required
                  ngModel
                />
              </div>
              <div class="form-group">
                <label for="email">Email address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Enter email"
                  ngModel
                />
              </div>
              <div class="form-group">
                <label for="phone">Phone number</label>
                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  name="phone"
                  placeholder="Enter phone number"
                  required
                  ngModel
                />
              </div>
              <div class="form-group">
                <label for="address">Pickup Location</label>
                <textarea
                  class="form-control"
                  id="address"
                  name="address"
                  rows="3"
                  required
                  ngModel
                ></textarea>
              </div>
            </div>

            <div class="col-md-6">
              <fieldset class="form-group">
                <div class="row">
                  <legend class="col-form-label col-sm-4 pt-0">Shipment Type</legend>
                  <div class="col-sm-8">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="shipmentType"
                        id="shipmentType1"
                        value="Dox"
                        [(ngModel)]="shipmentType"
                      />
                      <label class="form-check-label" for="shipmentType1"> Document </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="shipmentType"
                        id="shipmentType2"
                        value="NonDox"
                        [(ngModel)]="shipmentType"
                      />
                      <label class="form-check-label" for="shipmentType2"> Non Document </label>
                    </div>
                  </div>
                </div>
              </fieldset>
              <div class="form-group">
                <label for="shipmentQty">No of Shipment</label>
                <input
                  type="number"
                  class="form-control"
                  id="shipmentQty"
                  name="shipmentQty"
                  placeholder="Number of Shipment"
                  ngModel
                />
              </div>
              <div class="form-group">
                <label for="shipmentWeight">Total Weight</label>
                <input
                  type="text"
                  class="form-control"
                  id="shipmentWeight"
                  name="shipmentWeight"
                  placeholder="Total Weight"
                  ngModel
                />
              </div>
              <div class="form-group">
                <label for="deliveryAddress">Shipment/Delivery Location</label>
                <textarea
                  class="form-control"
                  id="deliveryAddress"
                  name="deliveryAddress"
                  rows="3"
                  required
                  ngModel
                ></textarea>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <button
                type="submit"
                class="btn btn-primary btn-block float-right"
                [disabled]="isSubmitting"
              >
                {{ isSubmitting ? 'Sending...' : 'Submit' }}
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
